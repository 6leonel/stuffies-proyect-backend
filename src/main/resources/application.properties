# ==========================
#  DATASOURCE ? MYSQL LOCAL
# ==========================
spring.datasource.url=jdbc:mysql://localhost:3306/stuffies_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================
#  JPA / HIBERNATE
# ==========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==========================
#  SERVER
# ==========================
server.port=8080

# ==========================
#  JWT
# ==========================
app.jwt.secret=ESTA_ES_UNA_CLAVE_LARGA_PARA_JWT_STUFFIES_2024
app.jwt.expiration=3600000

security.jwt.secret=ESTA_ES_UNA_CLAVE_LARGA_PARA_JWT_STUFFIES_2024_123456
security.jwt.expiration-ms=3600000

# ==========================
# HIKARI (OPCIONAL)
# ==========================
spring.datasource.hikari.maxLifetime=600000
spring.datasource.hikari.idleTimeout=300000
spring.datasource.hikari.connectionTimeout=30000
spring.datasource.hikari.maximumPoolSize=10

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
